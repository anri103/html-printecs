<div class="card card-blog">
    <div class="card-thumb-wrapper">
        <a href="#">
            <img src="@@thumbURL" alt="">
        </a>
    </div>
    <div class="card-body">
        <div class="card-meta text-body text-opacity-60">
            <span>@@metaDate</span>
        </div>
        <div class="card-title h3 fw-600">
            <a href="#">@@title</a>
        </div>
        <div class="text-body text-opacity-60">@@short</div>
    </div>
</div>
